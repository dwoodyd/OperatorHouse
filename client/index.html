  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Service worker disabled in dev — re-enable only in production builds */
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.includes('.manus.computer')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script>
      /* Analytics — Vite substitutes %VITE_VAR% tokens in HTML at build time.
         Plain <script> tags cannot use import.meta (ES modules only). */
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var siteId   = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.indexOf('%') !== -1) return;
        if (!siteId   || siteId.indexOf('%')   !== -1) return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = endpoint + '/umami';
        s.setAttribute('data-website-id', siteId);
        document.head.appendChild(s);
      })();
    </script>
  </body>
