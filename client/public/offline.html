<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operator House — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050504;
      color: #f0ead8;
      font-family: 'Playfair Display', Georgia, serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    canvas { position: fixed; inset: 0; pointer-events: none; opacity: 0.4; z-index: 0; }
    .content { position: relative; z-index: 1; }
    img { width: 72px; height: 72px; object-fit: contain; margin-bottom: 2rem; opacity: 0.85; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.8rem; }
    p {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem; letter-spacing: 0.08em;
      color: rgba(216,168,90,0.6); margin-bottom: 2.4rem;
      text-transform: uppercase;
    }
    button {
      background: rgba(216,168,90,0.9); color: #0e0c09;
      border: none; border-radius: 100px;
      padding: 0.85rem 2.2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.06em; cursor: pointer;
      transition: background 200ms, transform 200ms;
    }
    button:hover { background: #f4c87a; transform: translateY(-1px); }
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;700&display=swap');
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663270045694/UYrVyz2BYHYzFAx4PneEpK/oh-symbol-gold_7639fe83.webp" alt="Operator House" />
    <h1>You're offline.</h1>
    <p>Reconnect to continue operating.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let raf;
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);
    const pts = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      r: Math.random() * 1.3 + 0.3,
      vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15,
      o: Math.random() * 0.35 + 0.08,
    }));
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(216,168,90,${p.o})`; ctx.fill();
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
      });
      raf = requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
